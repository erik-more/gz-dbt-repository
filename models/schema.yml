version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:

      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez — one row per product_id per orders_id
        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Unique identifier for each customer order
          - name: pdt_id
            description: Product ID purchased in the order
          - name: revenue
            description: Revenue generated by the order
          - name: quantity
            description: Number of items purchased
        tests:
          - unique:
            column_name: "(orders_id || '-' || pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: List of products sold by Greenweez with their prices
        columns:
          - name: products_id
            description: primary key
            tests:
              - not_null
              - unique

      - name: ship
        identifier: raw_gz_ship
        description: Shipping fee and logistics cost per order
        columns:
          - name: orders_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: Shipping fee charged to the customer
          - name: logcost
            description: Cost of logistics for the order
          - name: ship_cost
            description: Total cost of shipping (string format in raw table)
    