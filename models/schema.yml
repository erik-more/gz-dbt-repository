version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:

      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez — one row per product_id per orders_id
        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Unique identifier for each customer order
          - name: pdt_id
            description: Product ID purchased in the order
          - name: revenue
            description: Revenue generated by the order
          - name: quantity
            description: Number of items purchased

      - name: product
        identifier: raw_gz_product
        description: List of products sold by Greenweez with their prices
        columns:
          - name: products_id
            description: Unique product identifier
          - name: purchSE_PRICE
            description: Purchase price of the product (as string in raw format)

      - name: ship
        identifier: raw_gz_ship
        description: Shipping fee and logistics cost per order
        columns:
          - name: orders_id
            description: Unique identifier of the shipped order
          - name: shipping_fee
            description: Shipping fee charged to the customer
          - name: shipping_fee_1
            description: Duplicate of shipping_fee for validation (can be ignored)
          - name: logcost
            description: Cost of logistics for the order
          - name: ship_cost
            description: Total cost of shipping (string format in raw table)
    